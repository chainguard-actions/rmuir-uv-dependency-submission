name: Test multiple uv.lock files submission
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_JOB: test
      GITHUB_WORKFLOW: "Test multiple uv.lock files submission"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify multiple uv.lock files are tracked by git
        run: |
          echo "Checking git ls-files for uv.lock files..."
          FILES=$(git ls-files -- uv.lock '**/uv.lock')
          echo "Found lockfiles:"
          echo "$FILES"
          COUNT=$(echo "$FILES" | grep -c 'uv.lock' || true)
          echo "Count: $COUNT"
          if [ "$COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 uv.lock files, found $COUNT"
            exit 1
          fi
          echo "PASS: found $COUNT uv.lock files"

      - name: Install mock gh to intercept dependency-graph API call
        run: |
          mkdir -p "$HOME/.local/bin"
          MOCK="$HOME/.local/bin/gh"
          printf '%s\n' '#!/bin/sh' > "$MOCK"
          printf '%s\n' '# Consume all stdin to avoid broken pipe' >> "$MOCK"
          printf '%s\n' 'cat > /dev/null' >> "$MOCK"
          printf '%s\n' 'echo "{\"id\":\"mock-id\",\"message\":\"Dependency snapshot created successfully.\",\"result\":\"SUCCESS\"}"' >> "$MOCK"
          printf '%s\n' 'exit 0' >> "$MOCK"
          chmod +x "$MOCK"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .

      - name: Assert action completed successfully with multiple lockfiles
        run: |
          echo "Action completed without error for multiple lockfiles"
          echo "PASS"
