name: Test uv.lock Parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action under test. It will attempt to submit to the dependency graph,
      # which may fail without a real GitHub token, but we verify the action runs
      # and Python is set up correctly.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: fake-token-for-testing

      - name: Assert Python 3.12 was set up by the action
        run: |
          VERSION=$(python --version 2>&1)
          echo "Python version: $VERSION"
          if ! echo "$VERSION" | grep -q "3.12"; then
            echo "FAIL: expected Python 3.12 to be set up by the action, got: $VERSION"
            exit 1
          fi
          echo "PASS: Python 3.12 is available after action ran"

      - name: Assert action.py exists and is valid Python
        run: |
          ACTION_PY="$GITHUB_WORKSPACE/action.py"
          echo "Checking: $ACTION_PY"
          if [ ! -f "$ACTION_PY" ]; then
            echo "FAIL: action.py not found at $ACTION_PY"
            exit 1
          fi
          python -c "import ast; ast.parse(open('$ACTION_PY').read())"
          echo "PASS: action.py is valid Python"

      - name: Assert uv.lock parsing logic works
        run: |
          cd "$GITHUB_WORKSPACE"
          python - <<'EOF'
          import tomllib, sys

          lockfile = "uv.lock"
          try:
              with open(lockfile, "rb") as f:
                  data = tomllib.load(f)
          except FileNotFoundError:
              print(f"FAIL: {lockfile} not found")
              sys.exit(1)

          if data.get("version") != 1:
              print(f"FAIL: unexpected uv.lock version: {data.get('version')}")
              sys.exit(1)

          packages = data.get("package", [])
          print(f"PASS: parsed uv.lock with {len(packages)} packages")
          EOF
