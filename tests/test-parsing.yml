name: Test uv.lock parsing logic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expected to fail at gh api call without real token)
        id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: fake-token-for-testing
          GITHUB_JOB: test
          GITHUB_WORKFLOW: test-workflow
          GITHUB_SERVER_URL: https://github.com
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
          GITHUB_REF: refs/heads/main

      - name: Verify Python 3.12 is set up correctly
        run: |
          PYTHON_VERSION=$(python3 --version 2>&1)
          echo "Python version: $PYTHON_VERSION"
          if ! echo "$PYTHON_VERSION" | grep -q "3.12"; then
            echo "FAIL: Expected Python 3.12 but got: $PYTHON_VERSION"
            exit 1
          fi
          echo "PASS: Python 3.12 is available"

      - name: Test uv.lock parsing via action.py module
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'EOF'
          import sys
          import os

          # Add the workspace to sys.path so we can import action.py
          sys.path.insert(0, os.environ.get("GITHUB_WORKSPACE", "."))

          import action

          # Find a uv.lock file to test with
          import subprocess
          result = subprocess.run(
              ["git", "ls-files", "--", "uv.lock", "**/uv.lock"],
              capture_output=True, text=True
          )
          lockfiles = [f.strip() for f in result.stdout.splitlines() if f.strip()]
          print(f"Found lock files: {lockfiles}")

          if not lockfiles:
              print("WARN: No uv.lock files found via git ls-files")
              sys.exit(0)

          # Parse the first lock file found
          lockfile = lockfiles[0]
          print(f"Parsing: {lockfile}")
          manifest = action.uvlock_to_manifest(lockfile)

          # Validate the manifest structure
          assert isinstance(manifest["name"], str), f"name should be str, got {type(manifest['name'])}"
          assert isinstance(manifest["file"], dict), f"file should be dict, got {type(manifest['file'])}"
          assert isinstance(manifest["resolved"], dict), f"resolved should be dict, got {type(manifest['resolved'])}"
          assert manifest["name"] == lockfile, f"name mismatch: {manifest['name']} != {lockfile}"
          assert manifest["file"]["source_location"] == lockfile, "source_location mismatch"

          print(f"PASS: Parsed {lockfile} successfully")
          print(f"  Found {len(manifest['resolved'])} resolved packages")
          EOF

      - name: Verify action.py exists in action directory
        run: |
          ACTION_PY="$GITHUB_WORKSPACE/action.py"
          echo "Checking: $ACTION_PY"
          if [ ! -f "$ACTION_PY" ]; then
            echo "FAIL: action.py not found at $ACTION_PY"
            exit 1
          fi
          echo "PASS: action.py found at $ACTION_PY"
