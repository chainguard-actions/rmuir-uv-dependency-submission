name: Test basic usage - uv dependency submission
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expected to fail at gh api call without real token)
        id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: fake-token-for-testing
          GITHUB_JOB: test
          GITHUB_WORKFLOW: test-workflow
          GITHUB_SERVER_URL: https://github.com
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
          GITHUB_REF: refs/heads/main

      - name: Verify Python 3.12 is available
        run: |
          PYTHON_VERSION=$(python3 --version 2>&1)
          echo "Python version: $PYTHON_VERSION"
          if ! echo "$PYTHON_VERSION" | grep -q "3.12"; then
            echo "FAIL: Expected Python 3.12 but got: $PYTHON_VERSION"
            exit 1
          fi
          echo "PASS: Python 3.12 is available"

      - name: Verify action.py exists in action directory
        run: |
          ACTION_PY="$GITHUB_WORKSPACE/action.py"
          echo "Checking: $ACTION_PY"
          if [ ! -f "$ACTION_PY" ]; then
            echo "FAIL: action.py not found"
            exit 1
          fi
          echo "PASS: action.py found"

      - name: Verify uv.lock is tracked by git
        run: |
          LOCKFILES=$(git ls-files -- uv.lock '**/uv.lock' 2>/dev/null || true)
          echo "Found lock files: $LOCKFILES"
          if [ -z "$LOCKFILES" ]; then
            echo "WARN: No uv.lock files found via git ls-files (may be expected in test environment)"
          else
            echo "PASS: Found uv.lock files that the action would process"
          fi
