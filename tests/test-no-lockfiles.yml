name: Test with no uv.lock files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Remove any uv.lock files from the workspace
        run: |
          # Remove any uv.lock files so git ls-files finds none
          find "$GITHUB_WORKSPACE" -name "uv.lock" -exec git rm --cached -f {} \; 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -name "uv.lock" -delete 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran with empty manifests (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with empty manifests"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
